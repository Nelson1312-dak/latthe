# Giám sát latbai.vn từ BÊN NGOÀI.
#
# Vì sao cần: gần như toàn bộ nền tảng chạy trên một máy ở nhà (Postgres, worker, nguồn nến,
# Open API DNSE đều đi qua tunnel của máy đó). Mọi thứ tự giám sát nằm trên chính máy ấy, nên máy
# tắt hoặc mất mạng là không ai báo gì cả. Ngày 20/10/2026 tunnel ngrok chết sau 13 ngày chạy:
# agent vẫn báo bình thường, cổng vẫn nghe, mà gọi từ ngoài vào lỗi TLS — site 503/502 suốt và
# chỉ phát hiện khi có người tình cờ mở ra xem.
#
# Chạy ở GitHub nên độc lập hoàn toàn với máy ở nhà. Job hỏng => GitHub gửi email cho chủ repo.
# watchdog-proxy.ps1 trên máy lo phần TỰ CHỮA (khởi động lại ngrok); đây là lưới an toàn cuối.
#
# VỀ CHU KỲ — đo thật chứ không phỏng đoán: đặt `*/15` nhưng ngày 20/10/2026 workflow này chỉ chạy
# ĐÚNG MỘT LẦN trong cả ngày (05:23 UTC), dù repo hôm đó có hàng chục lần push. GitHub xếp lịch
# cron theo kiểu "cố gắng hết sức" và bỏ qua rất nhiều lượt với chu kỳ dày trên máy chạy miễn phí.
# Để `*/15` là tự lừa mình: tưởng có giám sát 15 phút một lần, thực tế gần như không có.
#
# Nên đổi về mỗi giờ — mức GitHub thực sự chạy đều — và nhận đúng vai trò của nó: đây là lưới bắt
# trường hợp MÁY Ở NHÀ TẮT HẲN, mà việc đó thì biết sau một giờ vẫn còn kịp. Phần phát hiện nhanh
# nằm ở watchdog-proxy.ps1, chu kỳ 1 phút, đo được 48 giây từ lúc tunnel chết đến lúc sống lại.
# Muốn giám sát từ bên ngoài theo phút thì phải dùng dịch vụ theo dõi uptime riêng trỏ vào
# /api/health — endpoint đó đã trả 503 đúng lúc hỏng, kể cả khi worker chết.

name: Giám sát latbai.vn

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/health
        id: health
        run: |
          set -uo pipefail
          # Không dùng `set -e`: cần tự xử lý lỗi để in ra chẩn đoán có ích thay vì một dòng
          # "curl exited 35" trống rỗng.
          ma=$(curl -sS -m 30 -o health.json -w '%{http_code}' https://latbai.vn/api/health) || ma=000
          echo "HTTP $ma"
          if [ "$ma" = "000" ]; then
            echo "::error::Không gọi được latbai.vn/api/health (mạng lỗi hoặc Vercel chết)."
            exit 1
          fi
          cat health.json | jq . || { echo "::error::/api/health trả về thứ không phải JSON (HTTP $ma)."; cat health.json; exit 1; }

          ok=$(jq -r '.ok' health.json)
          db=$(jq -r '.db.reachable' health.json)
          if [ "$ok" != "true" ] || [ "$db" != "true" ]; then
            thieu=$(jq -r '.missing | join(", ")' health.json)
            echo "::error::Backend hỏng. ok=$ok db.reachable=$db missing=[$thieu]. Nhiều khả năng máy ở nhà tắt, local-proxy chết, hoặc tunnel ngrok đứt — xem docs/DEPLOY.md."
            exit 1
          fi

          # Worker im lặng quá 10 phút = không còn ghi giá / không còn nhận sự kiện lệnh của khách
          im=$(jq -r '[.workers[]? | select(.im_lang == true) | .ten] | join(", ")' health.json)
          if [ -n "$im" ]; then
            echo "::error::Worker im lặng quá lâu: $im. Khởi động lại theo mục Vận hành trong docs/DEPLOY.md (phải dừng cả supervise.ps1, không chỉ node.exe)."
            exit 1
          fi

          # Lệch commit chỉ là cảnh báo: ngay sau mỗi lần deploy là lệch, và đó là lúc cần khởi
          # động lại worker. Lệch kéo dài mới đáng lo, nhưng đừng để nó làm job đỏ liên tục.
          lech=$(jq -r '[.workers[]? | select(.lech_ban_deploy == true) | .ten] | join(", ")' health.json)
          if [ -n "$lech" ]; then
            echo "::warning::Worker đang chạy commit khác bản deploy: $lech. Nếu vừa deploy thì khởi động lại worker."
          fi
          echo "Backend bình thường."

      - name: Gọi /api/market
        run: |
          set -uo pipefail
          ma=$(curl -sS -m 40 -H 'Referer: https://latbai.vn/' -o market.json -w '%{http_code}' https://latbai.vn/api/market) || ma=000
          echo "HTTP $ma"
          if [ "$ma" != "200" ]; then
            echo "::error::Bảng giá hỏng (HTTP $ma). Nguồn nến đi vòng qua máy ở nhà, nên kiểm tunnel trước."
            head -c 400 market.json || true
            exit 1
          fi
          soMa=$(jq -r '.quotes | length' market.json)
          nguon=$(jq -r '.source' market.json)
          echo "Bảng giá: $soMa mã, nguồn $nguon"
          # Rổ thật là ~150 mã. Tụt sâu nghĩa là worker chết hoặc dữ liệu trong DB đã cũ.
          if [ "$soMa" -lt 100 ]; then
            echo "::error::Bảng giá chỉ còn $soMa mã (bình thường khoảng 150). Worker giá nhiều khả năng đã chết."
            exit 1
          fi
