<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quần Đảo Vô Tận</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="/src/style.css" />
<!--
  Vercel Web Analytics. ĐỪNG GỠ: thẻ này từng biến mất một lần khi xoá site cũ (nó nằm trong
  shell.js của site đó), và đồ thị Analytics rơi về 0 suốt hai tuần mà không có lỗi nào báo —
  nhìn như "không ai vào" trong khi thực ra là "không ai đo". Chạy local thì đường dẫn này
  trả 404, bình thường: chỉ Vercel mới phục vụ nó.
-->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ------------------------------------------------------------------ thanh trên -->
<header class="bar bar-top">
  <div class="res" id="resbar"></div>
  <div class="spacer"></div>
  <div class="group">
    <button class="stat lang-chip" id="lang-chip" title="Đổi tên làng và màu cờ">
      <i class="dot" id="lang-dot" aria-hidden="true"></i><strong id="lang-hud">Làng</strong>
    </button>
    <div class="stat" title="Cấp quần đảo"><small>Cấp</small><strong id="level">1</strong></div>
    <div class="stat reach" id="reach"><small>Xa</small><strong id="reach-val">0</strong></div>
    <button class="icon" id="gfx" title="Đồ hoạ" aria-label="Chất lượng đồ hoạ"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="gfx-menu"></button>
    <button class="icon" id="mute" title="Bật/tắt âm" aria-label="Bật hoặc tắt âm"></button>
    <button class="icon" id="pause" title="Tạm dừng (Esc)" aria-label="Tạm dừng"></button>
  </div>
</header>

<!-- ------------------------------------------------------------------ bảng đồ hoạ -->
<div class="gfx glass" id="gfx-menu" role="dialog" aria-label="Chất lượng đồ hoạ" hidden>
  <div class="gfx-head"><small>Đồ hoạ</small><span id="gfx-now"></span></div>
  <div class="seg" id="gfx-seg" role="radiogroup" aria-label="Bậc đồ hoạ">
    <button data-q="auto" role="radio">Tự động</button>
    <button data-q="low" role="radio">Thấp</button>
    <button data-q="medium" role="radio">Vừa</button>
    <button data-q="high" role="radio">Cao</button>
  </div>
  <button class="gfx-tilt" id="gfx-tilt" role="switch" aria-checked="false">
    <span>Mô hình thu nhỏ</span><i class="sw" aria-hidden="true"></i>
  </button>
  <p class="gfx-note" id="gfx-note"></p>
</div>

<!-- ------------------------------------------------------------------ minimap -->
<aside class="map" id="mapbox" title="Bấm để đưa camera tới đó">
  <canvas id="minimap" width="168" height="168"></canvas>
</aside>

<!--
  "Khi nào giặc tới, bằng gì, mình có đủ không" là ba con số phải thấy mà không đi tìm —
  trong một game thủ thành thì đó là câu hỏi duy nhất. Bản trước giấu chúng trong một thẻ
  ở góc dưới bên trái, dưới dạng "Thủ 68 · Giặc 32" mà không nói hai con số ấy nghĩa là gì.
-->
<!--
  Dải đợt và dải báo xếp CHUNG MỘT CỘT. Lúc đầu mỗi cái tự neo vào dưới thanh trên,
  và thế là chúng chồng đúng lên nhau — chữ của cái này đè lên chữ của cái kia, không
  đọc được cái nào. Một cột thì không có cách nào chồng được nữa.
-->
<div class="topstack" id="topstack">
  <aside class="wave" id="wave">
    <i class="wave-ico" id="wave-ico" aria-hidden="true"></i>
    <div class="wave-when">
      <small id="wave-kind">Cướp biển</small>
      <strong id="wave-clock">—</strong>
    </div>
    <div class="wave-mix" id="wave-mix"></div>
    <div class="wave-read">
      <strong id="wave-verdict">—</strong>
      <div class="wave-bar"><i id="wave-fill"></i></div>
    </div>
    <button class="wave-hire" id="wave-hire" hidden>Thuê lính</button>
  </aside>

  <!-- ------------------------------------------------------------- báo sự kiện -->
  <!--
    Một dải mảnh trượt xuống dưới thanh trên rồi tự tắt, bấm vào là tắt ngay. Bản trước là
    một thẻ to đặt giữa màn hình — che đúng chỗ đang chơi, và nếu bộ đếm giờ lỡ một nhịp thì
    nó nằm lì ở đó. Giờ `refresh()` tự kiểm theo đồng hồ thật nên không có đường nào kẹt lại.
  -->
  <button class="alert" id="alert" hidden>
    <i class="alert-ico" id="alert-ico" aria-hidden="true"></i>
    <span class="alert-col">
      <strong id="alert-title"></strong>
      <small id="alert-text"></small>
    </span>
  </button>
</div>

<!-- Khung ngắm giữa màn: chỗ mô hình mờ đứng trong chế độ xây. -->
<div class="aim" id="aim" hidden></div>

<!-- Ngăn kéo: thẻ công trình, hoặc một trong bốn ngăn của dock. Một chỗ duy nhất. -->
<section class="inspector" id="inspector" hidden></section>

<!-- ------------------------------------------------------------------ dock nổi -->
<!--
  Sáu mặt rời rạc gom lại thành MỘT thanh. Mỗi nút mở một ngăn kéo ở ngay trên nó, nên mắt
  chỉ phải nhìn hai chỗ: dải đợt trên đầu, và thanh này.
-->
<nav class="dock" id="dock">
  <div class="tiles" id="tiles"></div>
</nav>

<!-- --------------------------------------------------------- bảng quay lại -->
<div class="veil" id="welcome" hidden>
  <div class="card">
    <h2>Trong lúc bạn đi vắng</h2>
    <p class="away" id="away-time"></p>
    <ul class="loot" id="away-loot"></ul>
    <p class="capped" id="away-capped" hidden></p>
    <button class="primary" id="away-ok">Nhận</button>
  </div>
</div>

<div class="veil veil-soft" id="paused" hidden>
  <div class="card">
    <h2>Tạm dừng</h2>
    <p class="away">Không ai làm việc cả. Nhấn Esc hoặc bấm nút dưới để chạy tiếp.</p>
    <button class="primary" id="resume">Chạy tiếp</button>
  </div>
</div>

<!-- ------------------------------------------------------------------ lập làng -->
<div class="veil" id="lap-lang" hidden>
  <div class="card lang">
    <h2>Lập làng</h2>
    <p class="away">Đặt cho hòn đảo của bạn một cái tên và một màu cờ. Đổi lại lúc nào cũng được.</p>
    <div class="lang-ten">
      <input id="lang-ten" maxlength="24" autocomplete="off" spellcheck="false"
             placeholder="Tên làng" aria-label="Tên làng" />
      <button class="icon" id="lang-boc" title="Bốc một tên khác" aria-label="Bốc một tên khác"></button>
    </div>
    <div class="lang-mau" id="lang-mau" role="radiogroup" aria-label="Màu cờ"></div>
    <button class="primary" id="lang-ok">Vào đảo</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
