<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Endless Archipelago</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="/src/style.css" />
<!--
  Vercel Web Analytics. ĐỪNG GỠ: thẻ này từng biến mất một lần khi xoá site cũ (nó nằm trong
  shell.js của site đó), và đồ thị Analytics rơi về 0 suốt hai tuần mà không có lỗi nào báo —
  nhìn như "không ai vào" trong khi thực ra là "không ai đo". Chạy local thì đường dẫn này
  trả 404, bình thường: chỉ Vercel mới phục vụ nó.
-->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ------------------------------------------------------------------ thanh trên -->
<header class="bar bar-top">
  <div class="res" id="resbar"></div>
  <div class="spacer"></div>
  <div class="group">
    <button class="stat lang-chip" id="lang-chip" title="Rename village and flag colour">
      <i class="dot" id="lang-dot" aria-hidden="true"></i><strong id="lang-hud">Village</strong>
    </button>
    <div class="stat" title="Base level"><small>Lv</small><strong id="level">1</strong></div>
    <div class="stat reach" id="reach"><small>Reach</small><strong id="reach-val">0</strong></div>
    <button class="icon" id="map-btn" title="Minimap" aria-label="Toggle minimap"
            aria-pressed="false"></button>
    <button class="icon" id="gfx" title="Settings" aria-label="Settings and graphics"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="gfx-menu"></button>
    <button class="icon" id="mute" title="Sound" aria-label="Toggle sound"></button>
    <button class="icon" id="pause" title="Pause (Esc)" aria-label="Pause"></button>
  </div>
</header>

<!-- ------------------------------------------------------------------ bảng đồ hoạ -->
<div class="gfx glass" id="gfx-menu" role="dialog" aria-label="Settings and graphics" hidden>
  <!-- Quãng xa, mốc kế và nút âm ở đây; màn hẹp thêm tên làng và cấp (xem UIManager.xepHud). -->
  <div class="gfx-extra" id="gfx-extra" hidden></div>
  <div class="gfx-head"><small>Graphics</small><span id="gfx-now"></span></div>
  <div class="seg" id="gfx-seg" role="radiogroup" aria-label="Graphics quality">
    <button data-q="auto" role="radio">Auto</button>
    <button data-q="low" role="radio">Low</button>
    <button data-q="medium" role="radio">Medium</button>
    <button data-q="high" role="radio">High</button>
  </div>
  <button class="gfx-tilt" id="gfx-tilt" role="switch" aria-checked="false">
    <span>Tilt-shift</span><i class="sw" aria-hidden="true"></i>
  </button>
  <p class="gfx-note" id="gfx-note"></p>
</div>

<!-- ------------------------------------------------------------------ minimap -->
<aside class="map" id="mapbox" title="Click to move the camera there">
  <canvas id="minimap" width="168" height="168"></canvas>
</aside>

<!--
  "Khi nào giặc tới, bằng gì, mình có đủ không" là ba con số phải thấy mà không đi tìm —
  trong một game thủ thành thì đó là câu hỏi duy nhất. Bản trước giấu chúng trong một thẻ
  ở góc dưới bên trái, dưới dạng "Thủ 68 · Giặc 32" mà không nói hai con số ấy nghĩa là gì.
-->
<!--
  Dải đợt và dải báo xếp CHUNG MỘT CỘT. Lúc đầu mỗi cái tự neo vào dưới thanh trên,
  và thế là chúng chồng đúng lên nhau — chữ của cái này đè lên chữ của cái kia, không
  đọc được cái nào. Một cột thì không có cách nào chồng được nữa.
-->
<div class="topstack" id="topstack">
  <aside class="wave" id="wave">
    <i class="wave-ico" id="wave-ico" aria-hidden="true"></i>
    <div class="wave-when">
      <small id="wave-kind">Raid</small>
      <strong id="wave-clock">—</strong>
    </div>
    <div class="wave-mix" id="wave-mix"></div>
    <div class="wave-read">
      <strong id="wave-verdict">—</strong>
      <div class="wave-bar"><i id="wave-fill"></i></div>
    </div>
    <button class="wave-hire" id="wave-hire" hidden>Hire guards</button>
  </aside>

  <!-- ------------------------------------------------------------- báo sự kiện -->
  <!--
    Một dải mảnh trượt xuống dưới thanh trên rồi tự tắt, bấm vào là tắt ngay. Bản trước là
    một thẻ to đặt giữa màn hình — che đúng chỗ đang chơi, và nếu bộ đếm giờ lỡ một nhịp thì
    nó nằm lì ở đó. Giờ `refresh()` tự kiểm theo đồng hồ thật nên không có đường nào kẹt lại.
  -->
  <button class="alert" id="alert" hidden>
    <i class="alert-ico" id="alert-ico" aria-hidden="true"></i>
    <span class="alert-col">
      <strong id="alert-title"></strong>
      <small id="alert-text"></small>
    </span>
  </button>
</div>

<!-- Khung ngắm giữa màn: chỗ mô hình mờ đứng trong chế độ xây. -->
<div class="aim" id="aim" hidden></div>

<!-- Ngăn kéo: thẻ công trình, hoặc một trong bốn ngăn của dock. Một chỗ duy nhất. -->
<section class="inspector" id="inspector" hidden></section>

<!-- ------------------------------------------------------------------ dock nổi -->
<!--
  Sáu mặt rời rạc gom lại thành MỘT thanh. Mỗi nút mở một ngăn kéo ở ngay trên nó, nên mắt
  chỉ phải nhìn hai chỗ: dải đợt trên đầu, và thanh này.
-->
<nav class="dock" id="dock">
  <div class="tiles" id="tiles"></div>
</nav>

<!-- --------------------------------------------------------- bảng quay lại -->
<div class="veil" id="welcome" hidden>
  <div class="card">
    <h2>While you were away</h2>
    <p class="away" id="away-time"></p>
    <ul class="loot" id="away-loot"></ul>
    <p class="capped" id="away-capped" hidden></p>
    <button class="primary" id="away-ok">Collect</button>
  </div>
</div>

<div class="veil veil-soft" id="paused" hidden>
  <div class="card">
    <h2>Paused</h2>
    <p class="away">Nothing moves. Press Esc or the button to resume.</p>
    <button class="primary" id="resume">Resume</button>
  </div>
</div>

<!-- ------------------------------------------------------------------ lập làng -->
<div class="veil" id="lap-lang" hidden>
  <div class="card lang">
    <h2>Found your village</h2>
    <p class="away">Pick a name and a flag colour. You can change both later.</p>
    <div class="lang-ten">
      <input id="lang-ten" maxlength="24" autocomplete="off" spellcheck="false"
             placeholder="Village name" aria-label="Village name" />
      <button class="icon" id="lang-boc" title="Another name" aria-label="Another name"></button>
    </div>
    <div class="lang-mau" id="lang-mau" role="radiogroup" aria-label="Flag colour"></div>
    <button class="primary" id="lang-ok">Start</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
